<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- خلفية الأيقونة مع زوايا دائرية -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- تأثير التوهج -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" />
  
  <!-- فقاعة الرسائل والمحادثات -->
  <path d="M380 236c0-68.5-62.7-124-140-124S100 167.5 100 236c0 38.6 19.9 72.8 51.2 95.2L135 392l67.2-28.8c11.9 3.2 24.6 4.8 37.8 4.8 77.3 0 140-55.5 140-124z" 
        fill="url(#primaryGrad)" />
  
  <!-- صاعقة البرق الذكية (رمز الأتمتة والسرعة) -->
  <polygon points="265,170 205,255 245,255 235,310 295,225 255,225" 
           fill="#ffffff" />
</svg>
